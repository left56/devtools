[package]
name = "devtools"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native offline developer toolbox"

[[bin]]
name = "devtools"
path = "src/main.rs"

[dependencies]
devtools-core = { workspace = true }
devtools-tools = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = "=1.10.1"

# macOS: Metal path via font-kit only (no wayland/x11).
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["font-kit"] }

# Linux: X11 backend (also pulls font-kit). Wayland left off until we have a
# compositor session to verify; this box verifies under Xvfb/X11.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { workspace = true, features = ["x11"] }

# Windows placeholder — not verified yet. windows-manifest is a GPUI default;
# leave features empty until a Windows host builds.
[target.'cfg(target_os = "windows")'.dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }

[lints]
workspace = true
