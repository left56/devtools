[workspace]
resolver = "3"
members = [
    "crates/devtools",
    "crates/devtools-core",
    "crates/devtools-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = "0.22"
devtools-core = { path = "crates/devtools-core" }
devtools-tools = { path = "crates/devtools-tools" }
# Features are selected per target in crates/devtools/Cargo.toml.
# Do not turn on GPUI default features at the workspace level.
gpui = { version = "=0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# M2 pure-function tools — portable crates, no OS-specific APIs.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# Pin keeps tools building on rustc 1.85+; newer uuid raises rust-version.
uuid = { version = "=1.11.0", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"

# M3 inspectors — portable, no network.
regex = "1"
url = "2"
similar = "2"
cron = "0.15"

# M5 Explicit network — blocking; no background / no auto-request on open.
ureq = { version = "2", default-features = false, features = ["tls"] }
dns-lookup = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }


# gpui → zed-async-tar → xattr 0.2: libc 0.2.191 dropped Linux ENOATTR.
# Local patch maps it to ENODATA (same errno). Remove when upstream xattr
# 0.2.x is fixed or gpui moves off xattr 0.2.
[patch.crates-io]
xattr = { path = "patches/xattr-0.2.3" }
