[workspace]
resolver = "3"
members = [
    "crates/devtools",
    "crates/devtools-core",
    "crates/devtools-tools",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = "0.22"
devtools-core = { path = "crates/devtools-core" }
devtools-tools = { path = "crates/devtools-tools" }
# Features are selected per target in crates/devtools/Cargo.toml.
# Do not turn on GPUI default features at the workspace level.
gpui = { version = "=0.2.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "1.3"
# M2 pure-function tools — portable crates, no OS-specific APIs.
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
# Pin keeps tools building on rustc 1.85+; newer uuid raises rust-version.
uuid = { version = "=1.11.0", features = ["v1", "v3", "v4", "v5", "v6", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
serde_yaml = "0.9"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
quick-xml = "0.37"
csv = "1.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
fasteval = "0.2"
bcrypt = "0.16"
aes-gcm = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "u64_digit"] }
bip39 = { version = "2.1", default-features = false, features = ["std", "rand"] }
rand = "0.8"

# M3 inspectors — portable, no network.
regex = "1"
url = "2"
similar = "2"
cron = "0.15"

# M5 Explicit network — blocking; no background / no auto-request on open.
ureq = { version = "2", default-features = false, features = ["tls"] }
dns-lookup = "2"
x509-parser = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }


# gpui → zed-async-tar → xattr 0.2: libc 0.2.191 dropped Linux ENOATTR;
# also replace deprecated libc::uint32_t with u32 on macOS. Remove when
# upstream xattr 0.2.x is fixed or gpui moves off xattr 0.2.
[patch.crates-io]
xattr = { path = "patches/xattr-0.2.3" }
# GHSA-38c5-483c-4qqp / CVE-2026-42199: integer overflow in expand_rows (grid <=1.0.0).
# taffy 0.9 (via gpui 0.2.2) pins grid 0.18.0; force fixed 1.0.1 (API-compatible for taffy).
grid = { path = "patches/grid-1.0.1" }
